name: CI

# Mỗi prompt là một nhánh riêng nên chạy CI cho mọi nhánh được đẩy lên.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Edge Function khớp mã nguồn
        run: npm run functions:build -- --check
      # Build không cần Supabase: thiếu biến môi trường thì app chạy chế độ khách.
      - run: npm run build

  e2e:
    name: E2E (Playwright 360px + Supabase cục bộ)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Khởi động Supabase cục bộ (Auth, REST, Mailpit)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor
      - name: Biến môi trường từ Supabase cục bộ
        run: |
          supabase status -o json > /tmp/sb.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' /tmp/sb.json)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/sb.json)"
            echo "E2E_SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' /tmp/sb.json)"
            # Bật cửa test window.__wordwiseE2E (không có trong bản thật).
            echo "NEXT_PUBLIC_E2E=1"
            echo "E2E_MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"' /tmp/sb.json)"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Database (migrations, RLS tests, types, seed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed SQL khớp với từ mẫu JSON
        run: |
          npm run seed:build
          git diff --exit-code -- supabase/seed/words.sql
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Khởi động Supabase cục bộ (chỉ các dịch vụ cần)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor
      - name: Lint SQL
        run: supabase db lint --level error
      - name: Test RLS (pgTAP)
        run: supabase test db
      - name: TypeScript types khớp với schema
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          npx prettier --stdin-filepath src/lib/db/database.types.ts < /tmp/database.types.ts > /tmp/database.types.formatted.ts
          # Bỏ dòng phiên bản PostgREST vì cục bộ và cloud có thể khác nhau.
          if ! diff -u <(grep -v PostgrestVersion src/lib/db/database.types.ts) <(grep -v PostgrestVersion /tmp/database.types.formatted.ts) > /tmp/types.diff; then
            { echo '### database.types.ts lệch với schema'; echo '```diff'; head -c 60000 /tmp/types.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/types.diff
            # Annotation đọc được công khai qua API check-runs (không cần đăng nhập).
            msg=$(head -c 30000 /tmp/types.diff | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error file=src/lib/db/database.types.ts,title=types diff::${msg}"
            exit 1
          fi

  functions:
    name: Edge Function (Deno + Supabase cục bộ)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Khởi động Supabase cục bộ (DB, Auth, REST, Edge Runtime)
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,realtime,storage-api,supavisor
      - name: Biến môi trường từ Supabase cục bộ
        run: |
          supabase status -o json > /tmp/sb.json
          {
            echo "SUPABASE_URL=$(jq -r '.API_URL' /tmp/sb.json)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/sb.json)"
          } >> "$GITHUB_ENV"
      - name: Chạy Edge Function
        run: |
          nohup supabase functions serve > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$SUPABASE_URL/functions/v1/generate-word" || true)
            [ "$code" = "204" ] && exit 0
            sleep 2
          done
          cat /tmp/functions.log
          exit 1
      - name: Chạy thử generate-word và word-media
        run: npx tsx scripts/smoke-generate-word.ts
      - name: Nhật ký Edge Function
        if: always()
        run: cat /tmp/functions.log || true
