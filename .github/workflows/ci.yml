name: CI

# Mỗi prompt là một nhánh riêng nên chạy CI cho mọi nhánh được đẩy lên.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Database (migrations, RLS tests, types, seed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed SQL khớp với từ mẫu JSON
        run: |
          npm run seed:build
          git diff --exit-code -- supabase/seed/words.sql
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Khởi động Supabase cục bộ (chỉ các dịch vụ cần)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor
      - name: Lint SQL
        run: supabase db lint --level error
      - name: Test RLS (pgTAP)
        run: supabase test db
