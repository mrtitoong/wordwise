# Kiểm tra nhanh (chế độ khách) trên bản preview mỗi khi Vercel build xong một nhánh.
# Bản preview dùng Supabase thật nên chỉ chạy e2e/smoke (không đăng nhập, không ghi lên máy chủ);
# 7 luồng đầy đủ chạy trong ci.yml với Supabase cục bộ.
name: E2E bản preview

on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    name: Kiểm tra nhanh bản preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Khóa bỏ qua bảo vệ Vercel
        id: bypass
        env:
          SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::notice::Chưa có secret VERCEL_AUTOMATION_BYPASS_SECRET – bỏ qua kiểm tra bản preview."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Kiểm tra nhanh
        if: steps.bypass.outputs.skip != '1'
        run: npx playwright test e2e/smoke --project=mobile-360
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-playwright-report
          path: playwright-report
          retention-days: 7
