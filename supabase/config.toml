# Cấu hình Supabase CLI cho môi trường cục bộ và CI.
# Dự án cloud: jhvyyahowopzrpyenwdh (ap-southeast-1).
project_id = "wordwise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
# words.sql: 20 từ mẫu (cũng dùng cho cloud). local-users.sql: tài khoản mẫu, CHỈ cục bộ/CI.
sql_paths = ["./seed/words.sql", "./seed/local-users.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = false
