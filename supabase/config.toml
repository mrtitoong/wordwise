# Cấu hình Supabase CLI cho môi trường cục bộ và CI.
# Dự án cloud: jhvyyahowopzrpyenwdh (ap-southeast-1).
project_id = "wordwise"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
# words.sql: 20 từ mẫu (cũng dùng cho cloud). local-users.sql: tài khoản mẫu, CHỈ cục bộ/CI.
sql_paths = ["./seed/words.sql", "./seed/local-users.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
# 3000: npm run dev; 3100: E2E (playwright.config.ts).
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Cục bộ/CI: E2E gửi nhiều email liên tiếp. Cloud giữ giới hạn mặc định.
email_sent = 100

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
max_frequency = "1s"

# Email đăng nhập gồm link (token_hash, mở được ở trình duyệt khác) và mã 6 số.
[auth.email.template.magic_link]
subject = "Đăng nhập WordWise"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Đăng nhập WordWise"
content_path = "./supabase/templates/magic-link.html"

[auth.external.google]
# Cục bộ không bật Google; cloud cấu hình trên Dashboard.
enabled = false

# Hộp thư giả (Mailpit) để E2E đọc email đăng nhập.
[inbucket]
enabled = true
port = 54324

[studio]
enabled = false

# Edge Function tạo nội dung từ (Prompt 2.1). Mã nguồn ở src/functions/generate-word, file
# index.js do `npm run functions:build` sinh ra. Tự kiểm tra đăng nhập bên trong (khách vẫn
# tra được kho; pg_cron gọi worker bằng x-worker-secret) nên tắt kiểm tra JWT ở cổng.
[functions.generate-word]
enabled = true
verify_jwt = false
entrypoint = "./functions/generate-word/index.js"

# Audio và ảnh cho thẻ từ (Prompt 2.2). Mã nguồn ở src/functions/word-media. Khách vẫn nghe
# được audio đã có; pg_cron gọi worker bằng x-worker-secret nên tắt kiểm tra JWT ở cổng.
[functions.word-media]
enabled = true
verify_jwt = false
entrypoint = "./functions/word-media/index.js"

# Nhận dạng giọng nói qua Azure khi trình duyệt không có Web Speech API (Prompt 2.5). Mã nguồn
# ở src/functions/transcribe. Tự kiểm tra đăng nhập (khách nhận "login_required" thay vì lỗi 401
# để app báo dễ hiểu) nên tắt kiểm tra JWT ở cổng.
[functions.transcribe]
enabled = true
verify_jwt = false
entrypoint = "./functions/transcribe/index.js"

# Đọc chữ trên ảnh chụp (Prompt 2.6, chỉ Premium). Mã nguồn ở src/functions/ocr-image. Tự kiểm
# tra đăng nhập và gói (trả "login_required"/"premium_required" để app báo dễ hiểu) nên tắt kiểm
# tra JWT ở cổng.
[functions.ocr-image]
enabled = true
verify_jwt = false
entrypoint = "./functions/ocr-image/index.js"

# Chấm phát âm bằng Azure Pronunciation Assessment (Prompt 5.2). Mã nguồn ở
# src/functions/assess-pronunciation. Tự kiểm tra đăng nhập (khách nhận "login_required") nên tắt
# kiểm tra JWT ở cổng.
[functions.assess-pronunciation]
enabled = true
verify_jwt = false
entrypoint = "./functions/assess-pronunciation/index.js"

# src/functions/send-reminders. Chỉ pg_cron gọi (khóa worker trong header), không có JWT người dùng.
[functions.send-reminders]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-reminders/index.js"

# Phân tích danh sách của Admin (Prompt 7.2). Mã nguồn ở src/functions/analyze-list. Chỉ pg_cron
# và chính worker gọi (khóa worker trong header), không có JWT người dùng.
[functions.analyze-list]
enabled = true
verify_jwt = false
entrypoint = "./functions/analyze-list/index.js"

# Admin tạo lại một tab của thẻ từ khi duyệt danh sách (Prompt 7.3). Mã nguồn ở
# src/functions/admin-word. Tự kiểm tra JWT và vai trò admin trong function.
[functions.admin-word]
enabled = true
verify_jwt = false
entrypoint = "./functions/admin-word/index.js"
